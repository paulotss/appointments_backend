services:
  app:
    container_name: appointments-api-prod
    build:
      context: .
      target: production
    env_file:
      - .env.docker.prod
    command: sh -c "npm run prisma:generate && npm run prisma:migrate:deploy && npm run start:prod"
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: appointments-postgres-prod
    env_file:
      - .env.docker.prod
    ports:
      - '5433:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_prod_data:
