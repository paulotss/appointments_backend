services:
  app:
    container_name: appointments-api-prod
    build:
      context: .
      target: production
    env_file:
      - .env.docker.prod
    command: sh -c "npm run prisma:generate && npm run prisma:migrate:deploy && npm run start:prod"
    ports:
      - '3001:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: appointments-postgres-prod
    env_file:
      - .env.docker.prod
    ports:
      - '5433:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: appointments-minio-prod
    command: server /data --console-address ":9001"
    env_file:
      - .env.docker.prod
    ports:
      - '9010:9000'
      - '9011:9001'
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_prod_data:
  minio_prod_data:
