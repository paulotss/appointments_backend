services:
  app:
    container_name: appointments-api-dev
    build:
      context: .
      target: development
    env_file:
      - .env.docker.dev
    command: sh -c "npm install && npm run prisma:generate && npm run prisma:migrate:deploy && npm run start:dev"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: appointments-postgres-dev
    env_file:
      - .env.docker.dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: appointments-minio-dev
    command: server /data --console-address ":9001"
    env_file:
      - .env.docker.dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_dev_data:
  minio_dev_data:
  node_modules_dev:
